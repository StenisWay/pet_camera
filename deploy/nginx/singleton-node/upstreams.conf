# VM-3 的 upstream(14_API閘道與路由規範.md 第 5 節)。
# VM-3 沒有服務複本,兩台服務節點輪流分派,被動剔除失敗的一台。

upstream auth {
    server vm1.internal:23921 max_fails=1 fail_timeout=10s;
    server vm2.internal:23921 max_fails=1 fail_timeout=10s;
    keepalive 4;
}

upstream device {
    server vm1.internal:23922 max_fails=1 fail_timeout=10s;
    server vm2.internal:23922 max_fails=1 fail_timeout=10s;
    keepalive 4;
}

upstream event {
    server vm1.internal:23923 max_fails=1 fail_timeout=10s;
    server vm2.internal:23923 max_fails=1 fail_timeout=10s;
    keepalive 4;
}

upstream push {
    server vm1.internal:23924 max_fails=1 fail_timeout=10s;
    server vm2.internal:23924 max_fails=1 fail_timeout=10s;
    keepalive 4;
}

upstream media {
    server vm1.internal:23925 max_fails=1 fail_timeout=10s;
    server vm2.internal:23925 max_fails=1 fail_timeout=10s;
    keepalive 4;
}

upstream album {
    server vm1.internal:23926 max_fails=1 fail_timeout=10s;
    server vm2.internal:23926 max_fails=1 fail_timeout=10s;
    keepalive 4;
}

upstream stream {
    server vm1.internal:23927 max_fails=1 fail_timeout=10s;
    server vm2.internal:23927 max_fails=1 fail_timeout=10s;
    keepalive 4;
}

upstream worker {
    server 127.0.0.1:23931;
    keepalive 4;
}
