# 對外 listener(14_API閘道與路由規範.md 第 3 節)。白名單制:未列出的路徑回 GW_001。
# 新增公開端點時,本檔與規範第 3 節的路由表必須一起更新。

# /media/{media_item_id}:GET 屬 Media(F5),DELETE 屬 Album(F6)。
map $request_method $media_item_upstream {
    DELETE  album;
    default media;
}

server {
    listen 23912;
    charset utf-8;

    include /etc/nginx/pet_camera/proxy_params.conf;
    proxy_set_header X-Forwarded-Proto https;

    include /etc/nginx/pet_camera/errors.conf;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Auth
    location /auth/                                       { proxy_pass http://auth; }

    # /devices 由 Device、Event、Stream、Media 共用,依子路徑精確比對
    location = /devices                                   { proxy_pass http://device; }
    location ~ ^/devices/[^/]+$                           { proxy_pass http://device; }  # register、pair、PATCH、DELETE
    location ~ ^/devices/[^/]+/heartbeat$                 { proxy_pass http://device; }
    location ~ ^/devices/[^/]+/events$                    { proxy_pass http://event; }
    location ~ ^/devices/[^/]+/stream/                    { proxy_pass http://stream; }
    location ~ ^/devices/[^/]+/screenshot$                { proxy_pass http://media; }

    # Event
    location ~ ^/events/[^/]+$                            { proxy_pass http://event; }
    location ~ ^/events/[^/]+/playback-url$               { proxy_pass http://event; }

    # Media
    location ~ ^/events/[^/]+/(screenshot|clip)$          { proxy_pass http://media; }

    # Push
    location = /push-tokens                               { proxy_pass http://push; }
    location ~ ^/push-tokens/[^/]+$                       { proxy_pass http://push; }

    # Album / Media 共用 /media
    location = /media                                     { proxy_pass http://album; }
    location = /media/export/google-drive                 { proxy_pass http://album; }
    location ~ ^/media/[^/]+$                             { proxy_pass http://$media_item_upstream; }
    location ~ ^/integrations/google-drive/(oauth-url|oauth-callback)$ { proxy_pass http://album; }

    # 鏡頭 signaling:/internal 中唯一對外開放的路徑,由 Stream 以裝置憑證把關
    location ~ ^/internal/devices/[^/]+/stream/(pending-offer|answer|candidates)$ { proxy_pass http://stream; }

    location / { error_page 404 = @gw_001; return 404; }
}
