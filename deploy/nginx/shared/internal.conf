# 內部 listener(14_API閘道與路由規範.md 第 4 節)。三台 VM 使用同一份。
# 只綁 127.0.0.1:呼叫者一律打本機 Nginx,由 upstream 決定送本機或另一台。

server {
    listen 127.0.0.1:23919;
    charset utf-8;

    include /etc/nginx/pet_camera/proxy_params.conf;
    proxy_set_header X-Forwarded-Proto http;

    include /etc/nginx/pet_camera/errors.conf;

    # Device
    location ~ ^/internal/devices/[^/]+$                { proxy_pass http://device; }
    location ~ ^/internal/users/[^/]+/devices$          { proxy_pass http://device; }

    # Event
    location ~ ^/internal/devices/[^/]+/events$         { proxy_pass http://event; }
    location ~ ^/internal/events/[^/]+$                 { proxy_pass http://event; }

    # Push
    location = /internal/notifications/event-ready      { proxy_pass http://push; }

    # Album
    location ~ ^/internal/users/[^/]+/media$            { proxy_pass http://album; }

    # Media(轉碼 worker 回呼)
    location ~ ^/internal/media/[^/]+/(ready|failed)$   { proxy_pass http://media; }

    # 事件偵測 / 轉碼 worker(VM-3)
    location ~ ^/internal/(frames|clips)$               { proxy_pass http://worker; }

    location / { error_page 404 = @gw_001; return 404; }
}
