# Nginx 自行產生的錯誤,格式與各服務一致(14_API閘道與路由規範.md 第 8 節)。
# 只攔截 Nginx 自己的 502/504;服務回傳的錯誤(包含服務自己的 503)不受影響。

error_page 502 504 = @srv_002;

location @srv_002 {
    default_type application/json;
    return 503 '{"error":{"code":"SRV_002","message":"服務暫時無法使用"}}';
}

location @gw_001 {
    default_type application/json;
    return 404 '{"error":{"code":"GW_001","message":"路徑不存在"}}';
}
