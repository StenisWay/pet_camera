[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 連線字串不寫在這裡,由 migrations/env.py 從環境變數 DATABASE_URL_MIGRATE 讀取
sqlalchemy.url =

# migration 檔名前綴:0001_、0002_……,依序好排讀
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
