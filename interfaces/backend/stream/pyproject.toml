[project]
name = "stream"
version = "0.1.0"
description = "Pet Camera Stream 訊令服務(F1:即時串流)"
requires-python = ">=3.12"
# 本服務不擁有任何 Postgres 資料表(見 13_ADR_微服務與三節點部署.md 第 1 節),
# 因此不需要 sqlalchemy / asyncpg / alembic。狀態只進共用 Redis。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "uuid6>=2024.7.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# 目前不連真實外部服務:需要 Redis 的測試標記為 integration,預設不執行。
# 要跑時:uv run pytest -m integration(需 TEST_REDIS_URL 或可用的 Docker)
addopts = "-m 'not integration'"
markers = [
    "integration: 需要真實 Redis 的測試(testcontainers 或 TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 100
# tools/check_layers.py 是從 skill 原樣複製的工具,不做格式調整以便日後同步更新
exclude = ["tools"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
# Pydantic 的 mypy plugin:沒有它,model_config 的 populate_by_name 不會被理解,
# 用欄位名(而非 alias)建立 model 會被誤報 call-arg
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# 服務根目錄本身有 __init__.py(對外契約),不設這兩項 mypy 會把 app 當成 stream.app
explicit_package_bases = true
mypy_path = "."

[tool.coverage.run]
source = ["app"]
